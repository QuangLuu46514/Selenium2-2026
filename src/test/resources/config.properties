# ==============================
# Driver Configuration
# ==============================
run.mode=local
run.remote.url=

browser=chrome
browser.headless=false

# ==============================
# Chrome Configuration
# ==============================
browser.chrome.disable-notifications=true
browser.chrome.headless-argument=--headless=new

# ==============================
# Firefox Configuration
# ==============================
browser.firefox.disable-notifications=true
browser.firefox.headless-argument=-headless

# ==============================
# Edge Configuration
# ==============================
browser.edge.disable-notifications=false
browser.edge.headless-argument=--headless=new